<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c9a227;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8860b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="charcoalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle (dark charcoal) -->
  <circle cx="100" cy="100" r="95" fill="url(#charcoalGradient)" stroke="#1a1a2e" stroke-width="2"/>

  <!-- Outer ring (gold accent) -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#goldGradient)" stroke-width="4" opacity="0.8"/>

  <!-- The "9" shape with fist integrated -->
  <g id="nine-fist">
    <!-- Upper curve of 9 (top-right arc) -->
    <path d="M 100 50 Q 135 50 135 80 Q 135 110 100 110" 
          fill="none" stroke="url(#goldGradient)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Lower closed loop area (background for fist) -->
    <path d="M 100 110 Q 75 110 75 140 Q 75 165 100 165 Q 125 165 125 140 Q 125 110 100 110" 
          fill="url(#goldGradient)" opacity="0.15"/>

    <!-- Vertical stem of 9 connecting top and bottom -->
    <path d="M 100 110 L 100 165" 
          fill="none" stroke="url(#goldGradient)" stroke-width="14" stroke-linecap="round" filter="url(#glow)"/>
  </g>

  <!-- Integrated Fist (inside the lower loop of 9) -->
  <g id="fist" transform="translate(100, 135)">
    <!-- Fist palm (rounded square) -->
    <rect x="-8" y="-6" width="16" height="14" rx="4" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="1.5" filter="url(#glow)"/>

    <!-- Thumb -->
    <circle cx="-10" cy="-2" r="3" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="1"/>

    <!-- Fingers (4 bumps on top) -->
    <circle cx="-5" cy="-9" r="2.5" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="1"/>
    <circle cx="0" cy="-9.5" r="2.5" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="1"/>
    <circle cx="5" cy="-9" r="2.5" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="1"/>
    <circle cx="10" cy="-2" r="3" fill="url(#goldGradient)" stroke="#b8860b" stroke-width="1"/>

    <!-- Wrist/forearm line -->
    <line x1="-8" y1="8" x2="8" y2="8" stroke="#b8860b" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Ground roots/cracks (resilience symbol) -->
  <g id="roots" stroke="url(#goldGradient)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7">
    <!-- Left root -->
    <path d="M 80 165 Q 70 175 65 185"/>
    <!-- Center root -->
    <path d="M 100 165 L 100 180"/>
    <!-- Right root -->
    <path d="M 120 165 Q 130 175 135 185"/>
  </g>

  <!-- Accent light ray (horizon line) -->
  <line x1="20" y1="100" x2="180" y2="100" stroke="url(#goldGradient)" stroke-width="1.5" opacity="0.4"/>

  <!-- Corner accent sparkle -->
  <g id="sparkle" opacity="0.6">
    <circle cx="170" cy="30" r="2" fill="url(#goldGradient)"/>
    <line x1="170" y1="25" x2="170" y2="35" stroke="url(#goldGradient)" stroke-width="1"/>
    <line x1="165" y1="30" x2="175" y2="30" stroke="url(#goldGradient)" stroke-width="1"/>
  </g>
</svg>